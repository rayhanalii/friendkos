workflows:
  ios-unsigned:
    name: FriendKos - Unsigned Build
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      node: 24
    scripts:
      - name: Install dan build web
        script: |
          set -e
          npm install
          npm run build
          npx cap sync ios
      - name: Compile dan buat IPA tanpa signing
        script: |
          set -e
          cd ios/App
          xcodebuild -project App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            archive -archivePath build/App.xcarchive
          rm -rf Payload FriendKos.ipa
          mkdir -p Payload
          cp -R build/App.xcarchive/Products/Applications/App.app Payload/
          zip -r FriendKos.ipa Payload
    artifacts:
      - ios/App/FriendKos.ipa
